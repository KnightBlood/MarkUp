name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: 10.34.5

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/web build
      - run: pnpm --filter @markup/wails-frontend build
      - run: pnpm --filter @markup/tauri-frontend build
      - run: pnpm --filter @markup/electron build
      # Keep the web shell build output (deployable site).
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 90

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  electron:
    runs-on: ${{ matrix.os }}
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/electron build
      # AppImage tooling pulls extra Linux deps; `--dir` still validates the
      # packaging config (icon/asar/main bundle) on the runner.
      - if: runner.os == 'Linux'
        run: pnpm --filter @markup/electron exec electron-builder --dir --publish never
      - if: runner.os != 'Linux'
        run: pnpm --filter @markup/electron exec electron-builder --publish never
      # Keep installers (win nsis / mac dmg); Linux --dir keeps the unpacked app.
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: apps/electron/release/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: apps/electron/release/*.dmg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: apps/electron/release/linux-unpacked*
          if-no-files-found: error
          retention-days: 90

  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # Tauri v2 on Linux links GTK3 / WebKit2GTK 4.1 (runner image has no dev pkg).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/tauri-frontend build
      - run: cargo build --manifest-path apps/tauri/src-tauri/Cargo.toml
      # Keep the built binary (markup / markup.exe + pdb + dep-info).
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: apps/tauri/src-tauri/target/debug/markup*
          if-no-files-found: error
          retention-days: 90

  wails:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # go.sum lives in the Go app, not the repo root (the action's default
          # lookup warned "Dependencies file is not found" and skipped the cache).
          cache-dependency-path: apps/wails/go.sum
      # Wails v3 on Linux links GTK4 / WebKitGTK 6.0.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/wails-frontend build
      # ./... matches main + services (2 packages) and discards the executable;
      # build the single main package with an explicit output to keep the binary.
      - run: cd apps/wails && go build -o markup-wails .
      # Keep the built binary (markup-wails / markup-wails.exe).
      - uses: actions/upload-artifact@v4
        with:
          name: wails-${{ matrix.os }}
          path: apps/wails/markup-wails*
          if-no-files-found: error
          retention-days: 90

  # Fifth shell (Electrobun): unlike the other four, its main process is built
  # by Electrobun's own `hutch` CLI on the bun runtime, not by a pnpm script —
  # so the runner installs hutch, syncs its devkit SDK into
  # `apps/electrobun/.hutch` (the `electrobun/*` import map in tsconfig
  # resolves against it), typechecks, then packages.
  electrobun:
    runs-on: windows-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/electrobun-frontend build
      # Windows installer; PATH additions only survive inside the step that
      # makes them, so every hutch step re-prepends ~/.hutch/bin itself.
      - name: install hutch
        shell: pwsh
        run: '& ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))'
      - name: hutch install + electrobun sync + typecheck
        shell: pwsh
        working-directory: apps/electrobun
        run: |
          $env:PATH = "$env:USERPROFILE\.hutch\bin;$env:PATH"
          hutch install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          hutch electrobun sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          hutch typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # `electrobun.config.ts` `scripts.preBuild` rebuilds the vite bundle, and
      # `build.copy` stages `frontend/dist` into the packaged `views/app`.
      - name: hutch electrobun build
        shell: pwsh
        working-directory: apps/electrobun
        run: |
          $env:PATH = "$env:USERPROFILE\.hutch\bin;$env:PATH"
          hutch electrobun build --env=stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Keep the installer + unpacked app (drop the 200MB release archives in
      # `artifacts/`, which are local-only by policy).
      - uses: actions/upload-artifact@v4
        with:
          name: electrobun-windows
          path: apps/electrobun/dist/stable-win-x64
          if-no-files-found: error
          retention-days: 90
