name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: 10.34.5

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/web build
      - run: pnpm --filter @markup/wails-frontend build
      - run: pnpm --filter @markup/tauri-frontend build
      - run: pnpm --filter @markup/electron build
      # Keep the web shell build output (deployable site).
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 90

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      # `apps/electrobun/frontend` maps `electrobun/*` onto the devkit that
      # `hutch electrobun sync` writes into a gitignored `.hutch/`, so it can
      # only be typechecked by the electrobun job (which syncs first) — this
      # job stays hermetic and skips it.
      - run: pnpm -r --filter "!@markup/electrobun-frontend" typecheck
      # electron-builder rejects unknown keys via `additionalProperties: false`
      # only at package time; validate the installer config up front instead.
      - run: pnpm run check:packaging

  electron:
    runs-on: ${{ matrix.os }}
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/electron build
      # Per-OS installer, each with a user-selectable install location:
      #   win   → nsis assisted installer (directory page)
      #   mac   → pkg (destination page; dmg cannot choose a path)
      #   linux → AppImage, a single file the user places wherever they want
      - if: runner.os == 'Windows'
        run: pnpm --filter @markup/electron exec electron-builder --win nsis --publish never
      - if: runner.os == 'macOS'
        run: pnpm --filter @markup/electron exec electron-builder --mac pkg --publish never
      - if: runner.os == 'Linux'
        run: pnpm --filter @markup/electron exec electron-builder --linux AppImage --publish never
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: apps/electron/release/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: apps/electron/release/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: apps/electron/release/*.AppImage
          if-no-files-found: error
          retention-days: 90

  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # Tauri v2 on Linux links GTK3 / WebKit2GTK 4.1 (runner image has no dev pkg).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      # `tauri build` must run from `src-tauri` (it discovers the project by
      # looking for `tauri.conf.json`), and each script `cd`s there itself —
      # `pnpm --filter … exec` would run with cwd = `apps/tauri/frontend`,
      # which is not a Tauri project. One script per platform because Tauri
      # rejects bundle targets that don't apply to the host.
      - if: runner.os == 'Windows'
        run: pnpm --filter @markup/tauri-frontend run tauri:bundle:nsis
      - if: runner.os == 'Linux'
        run: pnpm --filter @markup/tauri-frontend run tauri:bundle:appimage
      # Tauri v2 has no `pkg` bundle type (only app/dmg), and a dmg cannot
      # choose an install location — so build the .app and package it here.
      - if: runner.os == 'macOS'
        run: pnpm --filter @markup/tauri-frontend run tauri:bundle:app
      - if: runner.os == 'macOS'
        run: |
          bash scripts/packaging/macos-pkg.sh \
            apps/tauri/src-tauri/target/release/bundle/macos/Markup.app \
            apps/tauri/src-tauri/target/release/bundle/pkg/Markup.pkg \
            dev.markup.editor 0.1.0
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: apps/tauri/src-tauri/target/release/bundle/pkg/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: apps/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 90

  wails:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # go.sum lives in the Go app, not the repo root (the action's default
          # lookup warned "Dependencies file is not found" and skipped the cache).
          cache-dependency-path: apps/wails/go.sum
      # Wails v3 on Linux links GTK4 / WebKitGTK 6.0.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      # The v3 CLI embeds its own task runner, so there is no separate `task`
      # to install.
      - name: install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: toolchain paths
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # `build/config.yml` is the single source for the app metadata and the
      # `.md` association; Wails generates the whole platform scaffolding
      # (Taskfiles, Info.plist, windows/nsis/project.nsi, icons, …) from it.
      # Direct CLI call because the Taskfiles it produces are the includes this
      # would otherwise need.
      - name: generate build assets
        working-directory: apps/wails/build
        run: wails3 update build-assets -name Markup -binaryname Markup -config config.yml -dir .
      - name: install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # One target per platform: `windows:package` would also build an MSIX and
      # `linux:package` would add deb/rpm/pacman, none of which we ship.
      # Windows → NSIS in per-user scope (no UAC) with its directory page and
      # `wails.associateFiles` for `.md` / `.markdown`.
      - name: package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/wails
        run: wails3 task windows:create:nsis:installer INSTALL_SCOPE=user
      # macOS → `.app` here, `.pkg` below (dmg cannot choose an install path).
      - name: package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/wails
        run: wails3 task darwin:create:app:bundle
      - name: macOS pkg
        if: runner.os == 'macOS'
        working-directory: apps/wails
        run: |
          bash "$GITHUB_WORKSPACE/scripts/packaging/macos-pkg.sh" \
            "$PWD/bin/Markup.app" "$PWD/bin/Markup.pkg" dev.markup.editor 0.1.0
      # Linux → AppImage built from our own `.desktop` so the association
      # (`MimeType=text/markdown;`) is present; `wails3 generate .desktop` has
      # no MimeType flag.
      - name: package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/wails
        run: |
          wails3 task linux:build
          mkdir -p build/linux/appimage
          cp bin/Markup build/linux/appimage/Markup
          cp build/appicon.png build/linux/appimage/Markup.png
          cp "$GITHUB_WORKSPACE/scripts/packaging/markup.desktop" build/linux/Markup.desktop
          cd build/linux/appimage
          wails3 generate appimage \
            -binary Markup \
            -icon Markup.png \
            -desktopfile ../Markup.desktop \
            -outputdir "$GITHUB_WORKSPACE/apps/wails/bin" \
            -builddir "$GITHUB_WORKSPACE/apps/wails/build/linux/appimage/build"
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wails-windows
          path: apps/wails/bin/*-installer.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wails-macos
          path: apps/wails/bin/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wails-linux
          path: apps/wails/bin/*.AppImage
          if-no-files-found: error
          retention-days: 90

  # Fifth shell (Electrobun). Electrobun's own installers are fixed-directory
  # (Windows/Linux) or dmg-only (macOS) and it cannot register file
  # associations outside macOS, so each platform post-processes the payload
  # `hutch electrobun build` produces into a real installer: NSIS on Windows,
  # a .pkg on macOS, an AppImage on Linux (see scripts/packaging/electrobun/).
  electrobun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      # Windows runners must not reach hutch through Git Bash: its GNU tar reads
      # `C:\...` as a remote host ("tar (child): Cannot connect to C: resolve
      # failed"), which breaks both the installer and `hutch electrobun sync`.
      - name: install hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: install hutch (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: hutch install + electrobun sync + typecheck (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/electrobun
        run: |
          hutch install
          hutch electrobun sync
          hutch typecheck
      - name: hutch install + electrobun sync + typecheck (Unix)
        if: runner.os != 'Windows'
        working-directory: apps/electrobun
        run: |
          hutch install
          hutch electrobun sync
          hutch typecheck
      # The frontend resolves `electrobun/*` through tsconfig `paths` into
      # `.hutch/devkit`, so it is only checkable after the sync above (the
      # shared typecheck job deliberately excludes this package).
      - run: corepack pnpm --filter @markup/electrobun-frontend typecheck
      - name: hutch electrobun build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/electrobun
        run: hutch electrobun build --env=stable
      - name: hutch electrobun build (Unix)
        if: runner.os != 'Windows'
        working-directory: apps/electrobun
        run: hutch electrobun build --env=stable

      # ---- Windows: NSIS wrapper (directory page + .md association) --------
      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/electrobun
        run: |
          $root = (Resolve-Path '../../').Path
          $buildRoot = (Get-ChildItem 'dist' -Directory | Where-Object Name -like '*-win-*' | Select-Object -First 1).FullName
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          tar -xf (Join-Path $buildRoot 'Markup-Setup.tar.zst') -C $stage
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            "-DPAYLOAD_DIR=$(Join-Path $stage 'Markup')" `
            "-DOUTFILE=$root\apps\electrobun\dist\Markup-Setup-x64.exe" `
            "-DVERSION=0.1.0" `
            "-DICON=$root\apps\electrobun\assets\icon.ico" `
            "$root\scripts\packaging\electrobun\windows.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---- macOS: .pkg (dmg has no install-location choice) -----------------
      - name: macOS installer
        if: runner.os == 'macOS'
        working-directory: apps/electrobun
        run: |
          # hutch names the platform directory `macos` (`stable-macos-arm64`).
          APP="$(ls -d dist/*-macos-*/Markup.app | head -n 1)"
          bash "$GITHUB_WORKSPACE/scripts/packaging/macos-pkg.sh" \
            "$APP" "$PWD/dist/Markup-macos.pkg" dev.markup.editor 0.1.0

      # ---- Linux: AppImage (user picks where the file lives) ----------------
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          # The tool is itself an AppImage; keep the real file under a distinct
          # name so the wrapper cannot resolve back to itself.
          curl -fsSL -o /usr/local/bin/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool.AppImage
          printf '#!/bin/sh\nexec /usr/local/bin/appimagetool.AppImage --appimage-extract-and-run "$@"\n' > /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
      - name: Linux installer
        if: runner.os == 'Linux'
        working-directory: apps/electrobun
        run: |
          # `writeReleaseArtifacts` moves the app bundle tar out of the build
          # root into `artifacts/`; the build root keeps only Electrobun's own
          # self-extracting installer, which we do not ship.
          ARCHIVE="$(ls -t artifacts/*-linux-*.tar.zst | head -n 1)"
          bash "$GITHUB_WORKSPACE/scripts/packaging/electrobun/linux-appimage.sh" \
            "$ARCHIVE" "$PWD/dist/Markup-x86_64.AppImage" assets/icon.png

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-windows
          path: apps/electrobun/dist/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-macos
          path: apps/electrobun/dist/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-linux
          path: apps/electrobun/dist/*.AppImage
          if-no-files-found: error
          retention-days: 90
