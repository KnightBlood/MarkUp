name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: 10.34.5

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/web build
      - run: pnpm --filter @markup/wails-frontend build
      - run: pnpm --filter @markup/tauri-frontend build
      - run: pnpm --filter @markup/electron build
      # Keep the web shell build output (deployable site).
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 90

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      # `apps/electrobun/frontend` maps `electrobun/*` onto the devkit that
      # `hutch electrobun sync` writes into a gitignored `.hutch/`, so it can
      # only be typechecked by the electrobun job (which syncs first) — this
      # job stays hermetic and skips it.
      - run: pnpm -r --filter "!@markup/electrobun-frontend" typecheck
      # electron-builder rejects unknown keys via `additionalProperties: false`
      # only at package time; validate the installer config up front instead.
      - run: pnpm run check:packaging

  electron:
    runs-on: ${{ matrix.os }}
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/electron build
      # Per-OS installer, each with a user-selectable install location:
      #   win   → nsis assisted installer (directory page)
      #   mac   → pkg (destination page; dmg cannot choose a path)
      #   linux → AppImage, a single file the user places wherever they want
      - if: runner.os == 'Windows'
        run: pnpm --filter @markup/electron exec electron-builder --win nsis --publish never
      - if: runner.os == 'macOS'
        run: pnpm --filter @markup/electron exec electron-builder --mac pkg --publish never
      - if: runner.os == 'Linux'
        run: pnpm --filter @markup/electron exec electron-builder --linux AppImage --publish never
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: apps/electron/release/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: apps/electron/release/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: apps/electron/release/*.AppImage
          if-no-files-found: error
          retention-days: 90

  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # Tauri v2 on Linux links GTK3 / WebKit2GTK 4.1 (runner image has no dev pkg).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      # `tauri build` also runs `beforeBuildCommand` (the vite bundle). Per-OS
      # bundle list because Tauri rejects targets that don't apply to the host.
      - if: runner.os == 'Windows'
        run: pnpm --filter @markup/tauri-frontend exec tauri build --bundles nsis
      - if: runner.os == 'Linux'
        run: pnpm --filter @markup/tauri-frontend exec tauri build --bundles appimage
      # Tauri v2 has no `pkg` bundle type (only app/dmg), and a dmg cannot
      # choose an install location — so build the .app and package it here.
      - if: runner.os == 'macOS'
        run: pnpm --filter @markup/tauri-frontend exec tauri build --bundles app
      - if: runner.os == 'macOS'
        run: |
          bash scripts/packaging/macos-pkg.sh \
            apps/tauri/src-tauri/target/release/bundle/macos/Markup.app \
            apps/tauri/src-tauri/target/release/bundle/pkg/Markup.pkg \
            dev.markup.editor 0.1.0
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: apps/tauri/src-tauri/target/release/bundle/pkg/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: apps/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 90

  wails:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # go.sum lives in the Go app, not the repo root (the action's default
          # lookup warned "Dependencies file is not found" and skipped the cache).
          cache-dependency-path: apps/wails/go.sum
      # Wails v3 on Linux links GTK4 / WebKitGTK 6.0.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/wails-frontend build
      # The v3 CLI embeds its own task runner, so there is no separate `task`
      # to install.
      - name: install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: toolchain paths
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # `build/config.yml` is the source of truth for `fileAssociations`; this
      # regenerates Info.plist / nsis/wails_tools.nsh from it.
      - name: refresh build assets
        working-directory: apps/wails
        run: wails3 task common:update:build-assets
      - name: install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # Windows → NSIS (MUI_PAGE_DIRECTORY: user picks the install folder)
      # Linux   → AppImage (user picks where the file lives)
      # macOS   → .app bundle, turned into a .pkg below (dmg cannot choose a path)
      - name: wails3 task package
        working-directory: apps/wails
        run: wails3 task package
      - name: macOS pkg
        if: runner.os == 'macOS'
        working-directory: apps/wails
        run: |
          bash "$GITHUB_WORKSPACE/scripts/packaging/macos-pkg.sh" \
            "$PWD/bin/Markup.app" "$PWD/bin/Markup.pkg" dev.markup.editor 0.1.0
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wails-windows
          path: apps/wails/bin/*-installer.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wails-macos
          path: apps/wails/bin/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wails-linux
          path: apps/wails/bin/*.AppImage
          if-no-files-found: error
          retention-days: 90

  # Fifth shell (Electrobun). Electrobun's own installers are fixed-directory
  # (Windows/Linux) or dmg-only (macOS) and it cannot register file
  # associations outside macOS, so each platform post-processes the payload
  # `hutch electrobun build` produces into a real installer: NSIS on Windows,
  # a .pkg on macOS, an AppImage on Linux (see scripts/packaging/electrobun/).
  electrobun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markup/electrobun-frontend build
      - name: install hutch
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -Command \
              "& ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))"
          else
            curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          fi
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: hutch install + electrobun sync + typecheck
        shell: bash
        working-directory: apps/electrobun
        run: |
          hutch install
          hutch electrobun sync
          hutch typecheck
      # The frontend resolves `electrobun/*` through tsconfig `paths` into
      # `.hutch/devkit`, so it is only checkable after the sync above (the
      # shared typecheck job deliberately excludes this package).
      - run: corepack pnpm --filter @markup/electrobun-frontend typecheck
      - name: hutch electrobun build
        shell: bash
        working-directory: apps/electrobun
        run: hutch electrobun build --env=stable

      # ---- Windows: NSIS wrapper (directory page + .md association) --------
      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/electrobun
        run: |
          $root = (Resolve-Path '../../').Path
          $buildRoot = (Get-ChildItem 'dist' -Directory | Where-Object Name -like '*-win-*' | Select-Object -First 1).FullName
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          tar -xf (Join-Path $buildRoot 'Markup-Setup.tar.zst') -C $stage
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            "-DPAYLOAD_DIR=$(Join-Path $stage 'Markup')" `
            "-DOUTFILE=$root\apps\electrobun\dist\Markup-Setup-x64.exe" `
            "-DVERSION=0.1.0" `
            "-DICON=$root\apps\electrobun\assets\icon.ico" `
            "$root\scripts\packaging\electrobun\windows.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---- macOS: .pkg (dmg has no install-location choice) -----------------
      - name: macOS installer
        if: runner.os == 'macOS'
        working-directory: apps/electrobun
        run: |
          APP="$(ls -d dist/*-mac-*/Markup.app | head -n 1)"
          bash "$GITHUB_WORKSPACE/scripts/packaging/macos-pkg.sh" \
            "$APP" "$PWD/dist/Markup-macos.pkg" dev.markup.editor 0.1.0

      # ---- Linux: AppImage (user picks where the file lives) ----------------
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # The tool itself is an AppImage; run it without FUSE in CI.
          printf '#!/bin/sh\nexec /usr/local/bin/appimagetool --appimage-extract-and-run "$@"\n' > /usr/local/bin/appimagetool-wrapper
          chmod +x /usr/local/bin/appimagetool-wrapper
          ln -sf /usr/local/bin/appimagetool-wrapper /usr/local/bin/appimagetool
      - name: Linux installer
        if: runner.os == 'Linux'
        working-directory: apps/electrobun
        run: |
          ROOT="$(ls -d dist/*-linux-*/ | head -n 1)"
          bash "$GITHUB_WORKSPACE/scripts/packaging/electrobun/linux-appimage.sh" \
            "$ROOT" "$PWD/dist/Markup-x86_64.AppImage" assets/icon.png

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-windows
          path: apps/electrobun/dist/*.exe
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-macos
          path: apps/electrobun/dist/*.pkg
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-linux
          path: apps/electrobun/dist/*.AppImage
          if-no-files-found: error
          retention-days: 90
