[package]
name = "markup"
version = "0.1.0"
description = "Markup - Typora-like markdown editor"
edition = "2021"

[lib]
name = "markup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
notify = "7"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
