version: '3'

# The platform Taskfiles and the shared `build/Taskfile.yml` are generated from
# `build/config.yml` by Wails itself — only the config, the icon source and
# this file are checked in:
#
#   cd build && wails3 update build-assets -name Markup -binaryname Markup -config config.yml -dir .
#
# CI runs that before packaging (see .github/workflows/build.yml). It has to be
# a direct `wails3` call, not a task, since these includes do not exist yet on a
# fresh checkout.
includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "Markup"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # The frontend is the pnpm workspace package `@markup/wails-frontend`; its
  # dependencies come from the repo-root `pnpm install`, so the generated
  # `install:frontend:deps:pnpm` / `frontend:run:pnpm` tasks are used as-is.
  PACKAGE_MANAGER: "pnpm"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
