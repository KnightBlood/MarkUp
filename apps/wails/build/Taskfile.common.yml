version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    generates:
      - go.sum
    sources:
      - go.mod
    cmds:
      - go mod tidy

  build:frontend:
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/*
    cmds:
      # The frontend is a pnpm workspace package, so its dependencies come from
      # the repo-root `pnpm install` and there is no `npm install` step here.
      # No generated bindings either: the view calls Go through `Call.ByName`
      # FQNs (`frontend/src/main.ts`).
      - corepack pnpm build

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "icons.icns"
      - "icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    cmds:
      - corepack pnpm dev

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
