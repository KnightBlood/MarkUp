# Configuration for the Wails shell's build assets.
#
# `info` and `fileAssociations` are the single source of truth: Wails generates
# every platform asset from this file —
#
#   cd build && wails3 update build-assets -name Markup -binaryname Markup \
#     -config config.yml -dir .
#
# which writes the Taskfiles, `darwin/Info.plist`, `windows/nsis/project.nsi`
# (directory page + `.md` association macro), the icons and the nfpm config.
# CI runs that before packaging; nothing it produces is checked in.
version: '3'

info:
  companyName: "Markup"
  productName: "Markup"
  productIdentifier: "dev.markup.editor"
  description: "Markdown editor"
  copyright: "(c) Markup"
  comments: "Markdown editor with WYSIWYG editing, diagrams and embeds."
  version: "v0.1.0"

# `.md` / `.markdown` open with Markup.
#   Windows → registry keys written by `nsis/project.nsi` (wails.associateFiles)
#   macOS   → CFBundleDocumentTypes in Info.plist
#   Linux   → MimeType= line in the AppImage .desktop
#             (build/Taskfile.linux.yml appends it, since the desktop generator
#             of `wails3 generate .desktop` has no MimeType flag)
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    iconName: icon
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown document
    iconName: icon
    role: Editor

other: []
